name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false

      - name: Test
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Build static binaries (linux amd64 + arm64) and SHA256SUMS
        env:
          VERSION: ${{ github.ref_name }}
        run: make build VERSION="$VERSION"

      - name: Check embedded version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          test "$(dist/snapshot-finder-linux-amd64 -V)" = "snapshot-finder $VERSION"
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag \
            $prerelease \
            dist/snapshot-finder-linux-amd64 \
            dist/snapshot-finder-linux-arm64 \
            dist/SHA256SUMS
